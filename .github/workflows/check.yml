name: Check
on:
  push:
    paths-ignore: ["docs/**", "*.md", "LICENSE", "NOTICE"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ubuntu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-vte-2.91 \
            gir1.2-webkit2-4.0 xdg-utils libglib2.0-bin fonts-dejavu-core xvfb xauth dbus-x11 libxtst6
      - name: Unit tests
        run: |
          /usr/bin/python3 -m unittest \
            herdr_browser.test_store herdr_browser.test_router \
            herdr_browser.test_reports herdr_browser.test_recency \
            herdr_browser.test_interactive_figures herdr_browser.test_presentation \
            tools.test_install_bundle
      - name: Native UI on private display
        run: |
          xvfb-run -a dbus-run-session -- env \
            HERDR_BROWSER_TEST_DISPLAY=private HERDR_BROWSER_NO_DESKTOP=1 \
            GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 \
            /usr/bin/python3 tools/run_native_tests.py
      - name: Syntax
        run: |
          bash -n install.sh
          for source in herdr_browser/*.js; do node --check "$source"; done
